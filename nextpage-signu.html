<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username</title>
    <link rel="icon" href="Logo.jpg" type="image/jpg">
    <style>
        :root {
            --primary-color: #6C63FF;
            --secondary-color: #4D44DB;
            --light-bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-dark: #2D3748;
            --text-medium: #4A5568;
            --border-color: #E2E8F0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background-color: #e6f7ff;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .login-container {
            background-color: #d9edff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
            padding: 40px;
        }
        
        .logo {
            margin-bottom: 24px;
        }
        
        .logo img {
            height: 48px;
            width: auto;
        }
        
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-dark);
        }
        
        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-medium);
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
        }
        
        .note {
            font-size: 13px;
            color: var(--text-medium);
            margin-top: 8px;
            text-align: left;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-medium);
            font-size: 14px;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        
        .divider-text {
            padding: 0 12px;
        }
        
        .next-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
        }
        
        .next-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.2);
        }
        
        .alternative-option {
            margin-top: 24px;
            font-size: 14px;
        }
        
        .alternative-option a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(720deg); }
        }

        .rotating {
            animation: rotate 0.6s linear;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="Logo.jpg" alt="SocialPortal Logo">
        </div>
        
        <h1>How you'll sign in</h1>
        
        <p style="margin-bottom: 24px; color: var(--text-medium);">Create a username for signing in to your SocialPortal account</p>
        
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" 
                   required pattern="[a-zA-Z0-9._-^$&()\- ]+" 
                   title="Cannot contain @[#=+*¥£€!'?';:/><~|\{}%^•">
            <p class="note">You can use letters, numbers & periods</p>
            <p class="note" id="username-error" style="display:none; color:#dc3545;"></p>
        </div>
        
        <button type="button" class="next-button" id="nextButton">Next</button>
        
        <div class="divider">
            <span class="divider-text">or</span>
        </div>
        
        <div class="alternative-option">
            <a href="https://auth.socialportal.com/account/social/v4/login?service=auth&provider=google&create_user_if_not_exists=1">Use your existing email</a>
        </div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/backend.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.getElementById('username');
            const nextButton = document.getElementById('nextButton');
            const usernameError = document.getElementById('username-error');
            
            nextButton.addEventListener('click', function() {
                if (usernameInput.checkValidity()) {
                    
                    this.classList.add('rotating');
                    
                    
                    setTimeout(async function() {
                        const uname = usernameInput.value.trim();
                        try {
                            const available = await SP.usernameAvailable(uname);
                            if (!available) {
                                nextButton.classList.remove('rotating');
                                usernameError.textContent = 'That username is already taken. Try another one.';
                                usernameError.style.display = 'block';
                                return;
                            }
                        } catch (err) {
                            nextButton.classList.remove('rotating');
                            usernameError.textContent = err.message;
                            usernameError.style.display = 'block';
                            return;
                        }

                        SP.draft.merge({ username: uname });
                        window.location.href = "nextpage-sign.html";
                    }, 300);
                } else {
                    alert('Username contains invalid characters. Cannot contain @[#=+*¥£€!\'?";:/><~|\\{}%^•');
                    usernameInput.focus();
                }
            });
            
            usernameInput.addEventListener('input', function() {
                this.setCustomValidity('');
                if (!this.checkValidity()) {
                    this.setCustomValidity('Cannot contain @[#=+*¥£€!\'?";:/><~|\\{}%^•');
                }
            });
        });
    </script>
</body>
</html>
