<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SocialPortal - Forgot Password</title>
  <link rel="icon" href="Logo.jpg" type="image/jpg" />
  <style>
    :root {
      --primary-color: #6c63ff;
      --secondary-color: #4d44db;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #2d3748;
      --text-medium: #4a5568;
      --border-color: #e2e8f0;
      --error-color: #dc3545;
      --success-color: #28a745;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #e6f7ff;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
      transition: opacity 0.25s ease-in-out;
    }

    .login-container {
      background-color: #d9edff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      overflow: hidden;
      padding: 40px;
    }

    .logo {
      margin-bottom: 24px;
      text-align: center;
    }

    .logo img {
      height: 48px;
      width: auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .description {
      color: var(--text-medium);
      margin-bottom: 24px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-medium);
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
    }

    .error-message {
      color: var(--error-color);
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }

    .success-message {
      color: var(--success-color);
      font-size: 13px;
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    .next-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .next-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.2);
    }

    .rotate {
      animation: rotateAnim 0.3s ease-in-out;
    }

    @keyframes rotateAnim {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(720deg);
      }
    }

    .fade-out {
      animation: fadeOut 0.25s ease-in-out forwards;
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    .success-check {
      margin: 10px auto 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--success-color);
      position: relative;
      animation: pop 0.3s ease-in-out;
    }

    .success-check::after {
      content: '';
      position: absolute;
      left: 11px;
      top: 6px;
      width: 10px;
      height: 20px;
      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    @keyframes pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
    }

    .footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="Logo.jpg" alt="SocialPortal Logo" />
    </div>

    <h1>Forgot Password</h1>
    <p class="description">Enter your email address to reset your password</p>

    <form id="forgot-password-form">
      <div class="input-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <button type="submit" class="next-button" id="reset-button">Reset Password</button>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>
      <div id="success-check" class="success-check" style="display: none;"></div>
    </form>

    <div class="footer">
      <a id="back-link">Back to Sign In</a>
    </div>
  </div>

  <audio id="success-audio">
    <source src="darksider.mp3" type="audio/mp3" />
  </audio>

  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/backend.js"></script>
  <script>
    const forgotPasswordForm = document.getElementById('forgot-password-form');
    const emailInput = document.getElementById('email');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const successCheck = document.getElementById('success-check');
    const resetButton = document.getElementById('reset-button');
    const backLink = document.getElementById('back-link');
    const successAudio = document.getElementById('success-audio');

    forgotPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetButton.classList.add('rotate');

      setTimeout(async () => {
        const email = emailInput.value.trim();
        if (email) {
          try {
            const { error } = await SP.sendPasswordReset(email);
            if (!error) {
              successMessage.textContent = 'Password reset link sent to your email.';
              successMessage.style.display = 'block';
              errorMessage.style.display = 'none';
              successCheck.style.display = 'block';
              successAudio.play();
              document.body.classList.add('fade-in');

              setTimeout(() => {
                window.location.href = 'Social.html';
              }, 300);
            } else {
              errorMessage.textContent = error.message || 'Could not send the reset link.';
              errorMessage.style.display = 'block';
              successMessage.style.display = 'none';
            }
          } catch (error) {
            console.error(error);
            errorMessage.textContent = 'Error sending password reset link.';
            errorMessage.style.display = 'block';
          }
        } else {
          errorMessage.textContent = 'Please enter your email address.';
          errorMessage.style.display = 'block';
        }
      }, 350);
    });

    backLink.addEventListener('click', (e) => {
      e.preventDefault();
      backLink.classList.add('rotate');
      document.body.classList.add('fade-out');
      successAudio.play();
      setTimeout(() => {
        window.location.href = 'Social.html';
      }, 350);
    });
  </script>
</body>
</html>
